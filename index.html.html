<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHA STATS LIVE — HandballStats Pro</title>
    <link rel="manifest" href="data:application/manifest+json,{
        &quot;name&quot;: &quot;WHA STATS LIVE&quot;,
        &quot;short_name&quot;: &quot;WHA STATS&quot;,
        &quot;start_url&quot;: &quot;.&quot;,
        &quot;display&quot;: &quot;standalone&quot;,
        &quot;background_color&quot;: &quot;#0f172a&quot;,
        &quot;theme_color&quot;: &quot;#3b82f6&quot;,
        &quot;icons&quot;: [{
            &quot;src&quot;: &quot;data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><rect width=%27100%27 height=%27100%27 rx=%2720%27 fill=%27%233b82f6%27/><text x=%2750%%27 y=%2758%%27 font-size=%2750%27 dominant-baseline=%27middle%27 text-anchor=%27middle%27 fill=%27white%27>🤾</text></svg>&quot;,
            &quot;sizes&quot;: &quot;192x192&quot;,
            &quot;type&quot;: &quot;image/svg+xml&quot;
        }]
    }">
    <meta name="theme-color" content="#3b82f6">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        sport: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            600: '#475569',
                            accent: '#3b82f6',
                            accentHover: '#2563eb',
                            success: '#22c55e',
                            danger: '#ef4444',
                            warning: '#f59e0b'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .touch-target { min-height: 48px; min-width: 48px; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        @media print {
            header, footer, .no-print { display: none !important; }
            body { background: #ffffff !important; color: #0f172a !important; }
            #tab-summary { display: block !important; }
            .bg-sport-800, .bg-sport-900 { background: #ffffff !important; color: #0f172a !important; border-color: #cbd5e1 !important; }
            .text-white, .text-slate-100, .text-slate-200, .text-slate-300 { color: #0f172a !important; }
            .text-slate-400 { color: #475569 !important; }
        }
    </style>
</head>
<body class="bg-sport-900 text-slate-100 min-h-screen flex flex-col antialiased">

    <header class="bg-sport-800 border-b border-sport-700 sticky top-0 z-40 px-4 py-3 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-lg flex items-center justify-center font-black text-xl">
                    <i class="fa-solid fa-handball"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                        WHA STATS <span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full font-medium">LIVE</span>
                    </h1>
                    <p class="text-xs text-slate-400" id="headerMatchInfo">Mój Zespół vs Przeciwnik</p>
                </div>
            </div>

            <!-- Top Navigation Tabs -->
            <nav class="flex items-center bg-sport-900 p-1 rounded-xl border border-sport-700 overflow-x-auto max-w-full">
                <button onclick="switchTab('setup')" id="nav-setup" class="px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg transition-all flex items-center gap-1.5 text-slate-400 hover:text-white whitespace-nowrap">
                    <i class="fa-solid fa-gear"></i> Skład &amp; Ustawienia
                </button>
                <button onclick="switchTab('match')" id="nav-match" class="px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg transition-all flex items-center gap-1.5 bg-blue-600 text-white whitespace-nowrap shadow">
                    <i class="fa-solid fa-stopwatch"></i> Boisko &amp; Mecz (Live)
                </button>
                <button onclick="switchTab('summary')" id="nav-summary" class="px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg transition-all flex items-center gap-1.5 text-slate-400 hover:text-white whitespace-nowrap">
                    <i class="fa-solid fa-chart-bar"></i> Podsumowanie
                </button>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 pb-24">

        <div id="tab-setup" class="hidden space-y-6">
            <div class="bg-sport-800 border border-sport-700 rounded-2xl p-4 sm:p-6 shadow-xl">
                <h2 class="text-base sm:text-lg font-bold text-white mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-clipboard-user text-blue-400"></i> Konfiguracja Spotkania
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Nazwa Zespołu</label>
                        <input type="text" id="teamName" value="Mój Zespół" class="w-full bg-sport-900 border border-sport-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Przeciwnik</label>
                        <input type="text" id="opponentName" value="Przeciwnik" class="w-full bg-sport-900 border border-sport-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Data / Turniej</label>
                        <input type="text" id="matchDate" value="Mecz Ligowy" class="w-full bg-sport-900 border border-sport-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div class="mt-4 flex gap-3">
                    <button onclick="startMatchSession()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2.5 rounded-xl text-sm transition shadow-lg flex items-center gap-2">
                        <i class="fa-solid fa-play"></i> Zapisz i Przejdź do Meczu
                    </button>
                    <button onclick="resetAllData()" class="bg-sport-700 hover:bg-sport-600 text-slate-300 font-medium px-4 py-2.5 rounded-xl text-sm transition">
                        Resetuj Wszystko
                    </button>
                </div>
            </div>

            <!-- Roster Management -->
            <div class="bg-sport-800
